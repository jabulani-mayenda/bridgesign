services:
  - type: web
    name: bridgesign
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: BRIDGESIGN_HOST
        value: 0.0.0.0
      - key: BRIDGESIGN_WARM_INFERENCE
        value: "0"
